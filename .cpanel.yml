deployment:
  tasks:
    - /usr/bin/rsync -rltDvz --delete --exclude ".git/" --exclude ".github/" --exclude ".cpanel.yml" --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r /home1/nanom638/repositories/nanomedia/ /home1/nanom638/public_html/
    - /bin/chmod 755 /home1/nanom638/public_html
    - /usr/bin/find /home1/nanom638/public_html -type d -exec /bin/chmod 755 {} \;
    - /usr/bin/find /home1/nanom638/public_html -type f -exec /bin/chmod 644 {} \;
